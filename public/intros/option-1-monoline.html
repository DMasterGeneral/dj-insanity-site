<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJ Insanity intro — Option 1 · Monoline</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #stage {
    position: fixed; inset: 0; cursor: pointer; touch-action: manipulation;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(37, 99, 235, 0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 55%),
      #050505;
  }
  #replay {
    position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 2;
    font: 600 12px/1 inherit; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.72); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
    padding: 10px 14px; border-radius: 999px; cursor: pointer; opacity: 0; transition: opacity .4s ease, background .2s ease, color .2s ease;
  }
  #replay.show { opacity: 1; }
  #replay:hover, #replay:focus-visible { background: rgba(37,99,235,.28); color: #fff; outline: none; }
  #replay[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="replay" type="button" hidden>Replay</button>

  /** Resample a polyline (flat [x0,y0,x1,y1,...]) to N points evenly spaced along its length. */

  /**

      var step = polyArea(outer) > 0 ? 1 : -1;                    // clockwise on screen
      var maxy = -1e9; for (i = 0; i < n; i++) maxy = Math.max(maxy, outer[2 * i + 1]);
      var ei = 0, bx = 1e9;

  /** Pen speed while the record is drawn: slow at the centre, flat out through the grooves, easing onto the rim. Maps time 0..1 to length 0..1. */
  function penCurve() {
    var LUT = new Float32Array(257), acc = 0, i;
    for (i = 1; i <= 256; i++) {

  var RECORD = [[0.5, 0.05, 1], [1, 0.05], [0.8, 0.31, 1], [1, 0.31], [0.5, 0.41, 1],
    [5, 0.565], [0.4, 0.61, 1], [5, 0.765], [0.4, 0.81, 1], [5, 0.965], [0.4, 1, 1], [1, 1]];

  // ================================================================ OPTION 1 — MONOLINE

  var T_DRAW = 240,     // the dot starts to move
      T_DRAWN = 1440,   // record finished (beat 3)
      T_PEEL = 1920,    // pen lifts off the rim, the record starts to unspool (beat 4)
      T_WAVE = 2880,    // fully unspooled: it is a waveform now (beat 6)
      T_FOLD = 3300,    // waveform starts folding into letters
      T_TITLE = 4080,   // one-line title complete
      T_SOLID = 4320,   // letters filled (beat 9)

  function setup(env) {

    var cx = W / 2, cy = H * 0.5;
    var R = Math.min(W * 0.37, H * 0.3, 250);
    var title = layoutTitle(Math.min(W * 0.84, 1040), 150, cx, cy, 0.035);
    var fill = titlePath(title);
    var N = 3400, i;
    var lw = clamp(R / 110, 1.15, 2.1);

    // ---- 1. the record, as one line
    var sp = buildSpiral(N, [
      [0.5, 0.05, 1], [1, 0.05], [0.8, 0.31, 1], [1, 0.31], [0.5, 0.41, 1],
      [5, 0.565], [0.4, 0.61, 1], [5, 0.765], [0.4, 0.81, 1], [5, 0.965], [0.4, 1, 1], [1, 1]
    ]);

    var prev = 0;
    for (i = 0; i < N - 1; i++) {
      var dx = sp.x[i + 1] - sp.x[i], dy = sp.y[i + 1] - sp.y[i];
      sLen[i] = Math.hypot(dx, dy) * R;
      var a = Math.atan2(dy, dx);
      if (i) { var d = a - prev; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; sTurn[i] = d; }

    }
    var nLabel = 0; for (i = 0; i < N; i++) if (sp.r[i] <= 0.312) nLabel = i;   // spindle + label: drawn in gold
    // pen speed while drawing: slow at the centre, flat out through the grooves, easing onto the rim
    var LUT = new Float32Array(257), acc = 0;
    for (i = 1; i <= 256; i++) {
      var q = i / 256, v = q < 0.7 ? 0.02 + q * q : (0.02 + 0.49) * lerp(1, 0.1, E.smooth((q - 0.7) / 0.3));
      acc += v; LUT[i] = acc;
    }
    function drawn(q) { var f = c01(q) * 256, k = Math.min(255, f | 0); return lerp(LUT[k], LUT[k + 1], f - k) / acc; }

    // ---- 3. the title, as one line (same number of points, so point i of the wave becomes point i of the title)
    var margin = title.font * 0.24;
    var ol = oneLineTitle(title, margin);
    var tl = resample(ol.pts, N);
    var kind = new Uint8Array(N);
    for (i = 0; i < N; i++) kind[i] = ol.kind[Math.min(ol.kind.length - 1, Math.ceil(tl.src[i]))];

    // ---- 2. the waveform: each point keeps an x close to where it will end up in the title
    var xL = title.left - margin, xR = title.right + margin, Ww = xR - xL;
    var ctl = [[0, xL]];
    ol.marks.forEach(function (m) { ctl.push([m.a, m.g.x0], [m.b, m.g.x1]); });
    ctl.push([ol.pts.length / 2 - 1, xR]);
    var wx = new Float32Array(N), wv = new Float32Array(N), c = 0;
    for (i = 0; i < N; i++) {
      var sv = tl.src[i];
      while (c < ctl.length - 2 && ctl[c + 1][0] < sv) c++;
      wx[i] = lerp(ctl[c][1], ctl[c + 1][1], c01((sv - ctl[c][0]) / Math.max(1e-6, ctl[c + 1][0] - ctl[c][0])));

    }
    var A0 = Math.min(H * 0.135, R * 0.72);

      var env = Math.pow(Math.max(0, Math.sin(Math.PI * c01(v))), 0.75);
      var amp = 0.62 + 0.38 * Math.sin(TAU * 1.4 * v - t * 0.0052);
      var s = 0.56 * Math.sin(TAU * 3.1 * v - t * 0.0125)
            + 0.30 * Math.sin(TAU * 7.3 * v + t * 0.0172 + 1.3)
            + 0.16 * Math.sin(TAU * 15.7 * v - t * 0.0260 + 0.4);

    }
    function waveAmp(t) {            // swells in as the line pays out, kicks on the beat, relaxes
      return A0 * (0.25 + 0.75 * E.smooth(seg(t, T_PEEL + 250, T_WAVE))) * (1 + 0.45 * Math.exp(-Math.max(0, t - T_WAVE) / 170) * (t >= T_WAVE ? 1 : 0));
    }

    var X = new Float32Array(N), Y = new Float32Array(N), Br = new Float32Array(N), Q = new Uint8Array(N);

    var bloom = makeBloom(canvas, dpr);
    var NB = 14, coreCol = [], glowCol = [];
    for (i = 0; i < NB; i++) {
      var b = (i + 0.5) / NB;
      coreCol.push('rgba(' + Math.round(lerp(70, 236, b)) + ',' + Math.round(lerp(120, 242, b)) + ',255,' + (0.18 + 0.82 * b).toFixed(3) + ')');
      glowCol.push('rgba(37,99,235,' + (0.05 + 0.4 * b).toFixed(3) + ')');
    }

    function strokeRuns(n, which, width) {
      ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (var b = 0; b < NB; b++) {
        var open = false, any = false;
        ctx.beginPath();
        for (var i = 0; i < n - 1; i++) {
          if (Q[i] === b) { if (!open) { ctx.moveTo(X[i], Y[i]); open = true; } ctx.lineTo(X[i + 1], Y[i + 1]); any = true; }
          else open = false;
        }
        if (any) { ctx.strokeStyle = which[b]; ctx.stroke(); }
      }
    }

    function render(t) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var pulse = Math.exp(-Math.max(0, t - T_DRAWN) / 260) * (t >= T_DRAWN ? 1 : 0);
        var sc = R * (1 + 0.035 * pulse), cr = Math.cos(rot), sr = Math.sin(rot);

        for (i = 0; i < n; i++) {
          var px = sp.x[i], py = sp.y[i];
          X[i] = cx + sc * (px * cr - py * sr); Y[i] = cy + sc * (px * sr + py * cr);
          // vinyl sheen: grooves catch the light in two opposite wedges that stay put while the disc turns
          var rr = sp.r[i] || 1e-6, cs = ((X[i] - cx) * 0.61 - (Y[i] - cy) * 0.79) / (sc * rr);
          var sh = cs * cs; sh = sh * sh * sh;

        }
        if (n >= 2 && f < N - 1) {                                   // the leading point sits exactly on the pen
          var u = f - (f | 0), a0 = n - 2;
          X[n - 1] = lerp(X[a0], X[n - 1], u); Y[n - 1] = lerp(Y[a0], Y[n - 1], u);
        }

        tipX = X[n - 1]; tipY = Y[n - 1];
        tipS = lerp(0, 1, E.outBack(seg(t, 0, 220))) * (1 + 0.5 * pulse);

        var q = seg(t, T_PEEL, T_WAVE), p = 0.06 * q + 0.94 * E.inOut3(q);
        var wz = 0.014, A = waveAmp(t);

        var vPeel = wv[Math.max(0, Math.min(N - 1, Math.round((1 - p * (1 + wz)) * (N - 2))))], calm = 0.16 * (1 - E.smooth(seg(p, 0.8, 1)));
        for (i = 0; i < N; i++) WYt[i] = cy + A * waveY(wv[i], t) * (calm > 0 ? E.smooth(c01((wv[i] - vPeel) / calm)) : 1);

        for (i = N - 2; i >= 0; i--) {

          var len = lerp(sLen[i], Math.hypot(wdx, wdy), kk);
          var ang = dir + kk * Math.atan2(wdy, wdx);
          x -= len * Math.cos(ang); y -= len * Math.sin(ang);
          X[i] = x; Y[i] = y;
          dir -= sTurn[i] * (1 - kk);

          Br[i] = kk > 0.98 ? 0.88 : lerp(0.5, 0.88, kk);
        }
        Br[N - 1] = 0.88;
        // the spool's hub (point 0) rides a fixed rail from centre stage to the left edge of the wave
        // On a narrow phone the spool must not leave the left edge and the pen must not leave the right one:
        // hold the hub in, and let the paid-out line run slightly compressed until the last of the label has gone.
        var hubX = Math.max(lerp(cx, xL, p * p), Math.min(cx, 6 + sp.r[peel] * R)), ox = hubX - X[0], oy = cy - Y[0];
        for (i = 0; i < N; i++) { X[i] += ox; Y[i] += oy; }
        if (X[N - 1] > xR && peel < N - 1) {
          var sq = (xR - X[peel]) / (X[N - 1] - X[peel]);
          for (i = peel + 1; i < N; i++) X[i] = X[peel] + (X[i] - X[peel]) * sq;
        }
        // sheen stays on what is still wound
        for (i = 0; i < peel; i++) {

        for (i = 0; i < N; i++) {
          var e = E.inOut3(c01(qq * 1.55 - 0.55 * wv[i]));

          var kd = kind[i];
          Br[i] = kd === 1 ? lerp(0.88, 0.55, solid) : lerp(0.88, kd === 2 ? 0 : 0.16, Math.max(solid, kd === 2 ? e * 0.6 : 0));

        // once the letters are solid the baseline rail is reeled in to the pen
        var reel = E.inOut3(seg(t, T_SOLID - 60, T_SOLID + 520));
        if (reel > 0) for (i = 0; i < N; i++) if (kind[i] !== 1 && wv[i] <= reel * 1.02) Br[i] = 0;

        var out = seg(t, T_SOLID + 520, T_SOLID + 800);

  }


  return { play: play, duration: DURATION, name: NAME };
})();

// ---- page glue (prototype only; in the site this becomes a React effect) ----
(function () {
  var q = new URLSearchParams(location.search);
  var at = q.has('t') ? parseFloat(q.get('t')) : null;
  var btn = document.getElementById('replay');
  var ctl = DJIntro.play(document.getElementById('stage'), {
    at: at != null && isFinite(at) ? at : null,
    reducedMotion: q.has('rm') ? q.get('rm') !== '0' : undefined,
    speed: q.has('speed') ? parseFloat(q.get('speed')) : 1,
    onComplete: function () {
      if (window.parent !== window) { try { window.parent.postMessage({ type: 'dj-intro-done' }, '*'); } catch (err) {} }
      if (q.has('embed')) return;
      btn.hidden = false; requestAnimationFrame(function () { btn.classList.add('show'); });
    }
  });
  btn.addEventListener('click', function (e) {
    e.stopPropagation(); btn.classList.remove('show'); btn.hidden = true; btn.blur(); ctl.replay();
  });
  btn.addEventListener('keydown', function (e) { e.stopPropagation(); });
  window.addEventListener('message', function (e) {
    var d = e.data, isObj = d && d.type === 'dj-intro-replay';
    if (d === 'dj-intro-replay' || isObj) { btn.classList.remove('show'); btn.hidden = true; ctl.replay(isObj ? d.speed : undefined); }
  });
  window.__intro = ctl;
})();
</script>
