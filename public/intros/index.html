<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>DJ Insanity — intro options</title>
<style>
  :root {
    --bg: #050505; --panel: rgba(12, 13, 17, .92); --line: rgba(255, 255, 255, .10);
    --text: #e9ecf3; --dim: #8b90a0; --electric: #2563EB; --gold: #F59E0B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body {
    font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  #dock {
    flex: none; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
  }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .label {
    flex: none; width: 46px; color: var(--dim);
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  .seg { display: flex; flex: 1 1 auto; min-width: 0; gap: 6px; }
  .seg button { flex: 1 1 0; min-width: 0; }
  button, a.btn {
    font: 600 13px/1.15 inherit; color: rgba(255, 255, 255, .78); text-decoration: none; text-align: center;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14);
    padding: 9px 6px; border-radius: 10px; cursor: pointer; min-height: 40px;
    transition: background .15s, color .15s, border-color .15s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button:hover, a.btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--electric); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--electric); border-color: var(--electric); color: #fff; }
  #speeds button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #111; }
  .seg button small { display: block; font-size: 10px; font-weight: 600; opacity: .7; margin-top: 2px; letter-spacing: .02em; }
  .name-short { display: none; }
  #status { flex: 1 1 auto; min-width: 0; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status b { color: var(--text); font-weight: 600; }
  #replay { flex: none; padding-inline: 16px; background: rgba(37, 99, 235, .22); border-color: rgba(37, 99, 235, .55); color: #fff; }
  a.btn { flex: none; padding-inline: 12px; display: inline-flex; align-items: center; }

  @media (max-width: 560px) {
    .label { display: none; }
    .name-long { display: none; }
    .name-short { display: inline; }
    button, a.btn { font-size: 12px; }
  }
  @media (max-height: 420px) {
    #dock { gap: 6px; padding-top: 6px; }
    button, a.btn { min-height: 32px; padding-block: 5px; }
    .seg button small { display: none; }
  }
</style>
</head>
<body>
<div id="stage"><iframe id="frame" title="Intro preview" allow="fullscreen"></iframe></div>

<div id="dock">
  <div class="row">
    <span class="label" id="l-intro">Intro</span>
    <div class="seg" id="options" role="group" aria-labelledby="l-intro"></div>
  </div>
  <div class="row">
    <span class="label" id="l-speed">Speed</span>
    <div class="seg" id="speeds" role="group" aria-labelledby="l-speed"></div>
  </div>
  <div class="row">
    <span id="status" aria-live="polite"></span>
    <a class="btn" id="full" target="_blank" rel="noopener">Full screen</a>
    <button type="button" id="replay">Replay</button>
  </div>
</div>

<script>
(function () {
  var OPTIONS = [
    { file: 'option-1-monoline.html',     name: 'Monoline',       short: 'Line'  },
    { file: 'option-2-stardust.html',     name: 'Stardust',       short: 'Dust'  },
    { file: 'option-3-oscilloscope.html', name: 'Oscilloscope',   short: 'Scope' },
    { file: 'option-4-lightpaint.html',   name: 'Light painting', short: 'Light' }
  ];
  var SPEEDS = [1, 0.8, 0.65, 0.5, 0.3];
  var BASE_MS = 5280;                       // every option runs 5.28 s at 100%

  var frame = document.getElementById('frame');
  var status = document.getElementById('status');
  var full = document.getElementById('full');
  var optBtns = [], spdBtns = [];
  var cur = { option: 1, speed: 1 };        // Stardust first: the current favourite

  // Restore a shared link such as  /intros/#o=3&s=0.65
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    var o = parseInt(h.get('o'), 10), s = parseFloat(h.get('s'));
    if (o >= 1 && o <= OPTIONS.length) cur.option = o - 1;
    if (SPEEDS.indexOf(s) !== -1) cur.speed = s;
  })();

  function secs(speed) { return (BASE_MS / speed / 1000).toFixed(1) + 's'; }
  function pct(speed) { return Math.round(speed * 100) + '%'; }

  OPTIONS.forEach(function (o, i) {
    var b = document.createElement('button'); b.type = 'button';
    b.innerHTML = (i + 1) + ' · <span class="name-long"></span><span class="name-short"></span>';
    b.querySelector('.name-long').textContent = o.name;
    b.querySelector('.name-short').textContent = o.short;
    b.setAttribute('aria-label', 'Option ' + (i + 1) + ': ' + o.name);
    b.addEventListener('click', function () { cur.option = i; load(); });
    document.getElementById('options').appendChild(b); optBtns.push(b);
  });
  SPEEDS.forEach(function (s) {
    var b = document.createElement('button'); b.type = 'button';
    b.innerHTML = pct(s) + '<small>' + secs(s) + '</small>';
    b.setAttribute('aria-label', pct(s) + ' speed, ' + secs(s).replace('s', ' seconds'));
    b.addEventListener('click', function () { cur.speed = s; replay(); });
    document.getElementById('speeds').appendChild(b); spdBtns.push(b);
  });

  function src(embed) {
    // rm=0: always show the full animation here, even on a phone set to reduce motion
    return OPTIONS[cur.option].file + '?speed=' + cur.speed + '&rm=0' + (embed ? '&embed=1' : '');
  }
  function paint(playing) {
    optBtns.forEach(function (b, i) { b.setAttribute('aria-pressed', i === cur.option); });
    spdBtns.forEach(function (b, i) { b.setAttribute('aria-pressed', SPEEDS[i] === cur.speed); });
    var o = OPTIONS[cur.option];
    status.innerHTML = '';
    var b = document.createElement('b'); b.textContent = o.name;
    status.appendChild(b);
    status.appendChild(document.createTextNode(' · ' + pct(cur.speed) + ' speed · ' + secs(cur.speed) +
      (playing ? ' · tap the animation to skip' : ' · finished')));
    full.href = src(false);
    try { history.replaceState(null, '', '#o=' + (cur.option + 1) + '&s=' + cur.speed); } catch (e) {}
  }
  function load() { paint(true); frame.src = src(true); }
  function replay() {
    paint(true);
    try { frame.contentWindow.postMessage({ type: 'dj-intro-replay', speed: cur.speed }, '*'); }
    catch (e) { frame.src = src(true); }
  }
  document.getElementById('replay').addEventListener('click', replay);
  window.addEventListener('message', function (e) {
    if (e.source === frame.contentWindow && e.data && e.data.type === 'dj-intro-done') paint(false);
  });
  load();
})();
</script>
</body>
</html>
